name: DartPad CI & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-protocol-and-receiver:
    name: Analyze & Test (Protocol + Receiver)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Analyze code
        run: dart analyze packages/dartpad_protocol apps/dartpad_receiver

      - name: Run unit & integration tests
        run: dart test packages/dartpad_protocol apps/dartpad_receiver

      - name: Run Receiver Self-Test
        run: dart run apps/dartpad_receiver/bin/dartpad_receiver.dart --self-test

  build-windows:
    name: Build Windows Installer (DartPad-Setup.exe) & Portable (DartPad.exe)
    needs: test-protocol-and-receiver
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Compile Single Standalone DartPad.exe (with Embedded GUI Dashboard)
        run: |
          dart compile exe apps/dartpad_receiver/bin/dartpad_receiver.dart -o DartPad.exe

      - name: Verify DartPad.exe --self-test on Windows
        run: .\DartPad.exe --self-test

      - name: Build Windows Setup Installer (DartPad-Setup.exe via Inno Setup)
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" apps\dartpad_receiver\installer\dartpad_setup.iss

      - name: Upload Windows Installer & Portable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dartpad-windows-binaries
          path: |
            release-output/DartPad-Setup.exe
            DartPad.exe

      - name: Publish Windows Installer & Portable EXE to GitHub Release Immediately
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.2.0' }}
          name: "DartPad ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.2.0' }} — Windows Installer (DartPad-Setup.exe), Portable EXE & Android APK"
          files: |
            release-output/DartPad-Setup.exe
            DartPad.exe

  build-android:
    name: Build Android Controller (.apk)
    needs: test-protocol-and-receiver
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android runner, patch Manifest/Permissions/Keystore & Build APK
        working-directory: apps/dartpad_mobile
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.ferdlcx.dartpad --project-name dartpad_mobile .
          fi

          python3 - << 'PYEOF'
          import os, re, pathlib

          # 1. Patch AndroidManifest.xml with CAMERA, Wi-Fi/Multicast, Cleartext HTTP (local IP :42101), & dartpad:// deep link
          manifest_path = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          manifest = manifest_path.read_text(encoding="utf-8")

          perms = [
              '<uses-permission android:name="android.permission.INTERNET"/>',
              '<uses-permission android:name="android.permission.CAMERA"/>',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>',
              '<uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>',
              '<uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/>',
              '<uses-feature android:name="android.hardware.camera" android:required="false"/>',
          ]
          missing_perms = [p for p in perms if p.split('"')[1] not in manifest]
          if missing_perms:
              manifest = re.sub(
                  r'(<manifest[^>]*>)',
                  r'\1\n    ' + '\n    '.join(missing_perms),
                  manifest,
                  count=1,
              )

          if 'usesCleartextTraffic' not in manifest:
              manifest = re.sub(
                  r'<application\b',
                  '<application android:usesCleartextTraffic="true"',
                  manifest,
                  count=1,
              )

          if 'android:scheme="dartpad"' not in manifest:
              deep_link = '''
            <intent-filter>
                <action android:name="android.intent.action.VIEW"/>
                <category android:name="android.intent.category.DEFAULT"/>
                <category android:name="android.intent.category.BROWSABLE"/>
                <data android:scheme="dartpad" android:host="connect"/>
            </intent-filter>'''
              manifest = manifest.replace('</activity>', deep_link + '\n        </activity>', 1)

          manifest_path.write_text(manifest, encoding="utf-8")

          # 2. Patch Gradle release signing using consistent apps/dartpad_mobile/android_signing/dartpad_release.jks
          #    so every future APK cleanly overwrites ("timpa") previous versions without uninstalling!
          keystore_abs = str(pathlib.Path("android_signing/dartpad_release.jks").resolve())
          kts_path = pathlib.Path("android/app/build.gradle.kts")
          groovy_path = pathlib.Path("android/app/build.gradle")

          if kts_path.exists():
              g = kts_path.read_text(encoding="utf-8")
              g = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = maxOf(flutter.minSdkVersion, 21)', g)
              if 'signingConfigs' not in g:
                  signing_block = f'''    signingConfigs {{
        create("release") {{
            storeFile = file("{keystore_abs}")
            storePassword = "dartpad_release_key"
            keyAlias = "dartpad"
            keyPassword = "dartpad_release_key"
        }}
    }}
'''
                  g = g.replace('    buildTypes {', signing_block + '    buildTypes {', 1)
              else:
                  # Replace debug signing reference or inject release signing config if buildTypes exists
                  if 'create("release")' not in g:
                      signing_block = f'''        create("release") {{
            storeFile = file("{keystore_abs}")
            storePassword = "dartpad_release_key"
            keyAlias = "dartpad"
            keyPassword = "dartpad_release_key"
        }}
'''
                      g = g.replace('signingConfigs {', 'signingConfigs {\n' + signing_block, 1)
              g = re.sub(
                  r'(getByName\("release"\)\s*\{[^}]*?)signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
                  r'\1signingConfig = signingConfigs.getByName("release")',
                  g,
                  flags=re.S,
              )
              if 'signingConfig = signingConfigs.getByName("release")' not in g:
                  g = g.replace(
                      'getByName("release") {',
                      'getByName("release") {\n            signingConfig = signingConfigs.getByName("release")',
                      1,
                  )
              kts_path.write_text(g, encoding="utf-8")
          elif groovy_path.exists():
              g = groovy_path.read_text(encoding="utf-8")
              g = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion Math.max(flutter.minSdkVersion, 21)', g)
              g = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = Math.max(flutter.minSdkVersion, 21)', g)
              if 'signingConfigs' not in g:
                  signing_block = f'''    signingConfigs {{
        release {{
            storeFile file("{keystore_abs}")
            storePassword "dartpad_release_key"
            keyAlias "dartpad"
            keyPassword "dartpad_release_key"
        }}
    }}
'''
                  g = g.replace('    buildTypes {', signing_block + '    buildTypes {', 1)
              g = g.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
              g = g.replace('signingConfig = signingConfigs.debug', 'signingConfig = signingConfigs.release')
              groovy_path.write_text(g, encoding="utf-8")
          PYEOF

          flutter pub get
          flutter analyze
          BUILD_NUMBER=$(( $(git rev-list --count HEAD) + 10 ))
          flutter build apk --release --build-name=0.2.0 --build-number=$BUILD_NUMBER
          cp build/app/outputs/flutter-apk/app-release.apk dartpad-mobile-android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dartpad-android-apk
          path: apps/dartpad_mobile/dartpad-mobile-android.apk

      - name: Publish Android APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.2.0' }}
          name: "DartPad ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.2.0' }} — Windows Installer (DartPad-Setup.exe), Portable EXE & Android APK"
          files: apps/dartpad_mobile/dartpad-mobile-android.apk
